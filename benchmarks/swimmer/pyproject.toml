[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprii-swimmer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "torch>=2.3", "mujoco==3.3.5"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.7", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
